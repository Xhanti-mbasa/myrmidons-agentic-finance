  condition = "AND"
  paths = ['''^\.gitleaks\.toml$''', '''^docs/BASELINE_PROGRESS\.md$''', '''^docs/PROJECT_STATUS\.md$''']
  regexes = ['''^C965811C463F2E5E019A4EA379F4A1F61E0F4544431F001FF5A31BFA34AD2E8E$''']

