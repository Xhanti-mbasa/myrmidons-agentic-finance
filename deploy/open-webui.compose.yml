# Open WebUI is a model/agent workspace, not a payment signer.
# Start with: docker compose --env-file .env -f deploy/open-webui.compose.yml up -d
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: "${WEBUI_OLLAMA_URL:-http://host.docker.internal:11434}"
      WEBUI_AUTH: "True"
      ENABLE_SIGNUP: "False"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}"
volumes:
  open-webui-data:
