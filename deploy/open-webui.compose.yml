# Open WebUI is a model/agent workspace, not a payment signer.
# Start with: docker compose --env-file .env -f deploy/open-webui.compose.yml up -d
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3@sha256:46b59158e6558eeb980bc828e0f1b30238ad24d82ed84d5e5eda1dab2a082f14
    restart: unless-stopped
    depends_on:
      harness:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: "${WEBUI_OLLAMA_URL:-http://host.docker.internal:11434}"
      WEBUI_AUTH: "True"
      ENABLE_SIGNUP: "False"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}"
  harness:
    user: "${HARNESS_UID:-1000}:${HARNESS_GID:-1000}"
    build:
      context: ..
      dockerfile: deploy/harness.Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ../secrets/harness:/state
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  open-webui-data:
