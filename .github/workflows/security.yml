name: Adversarial security evidence
on:
  push:
    branches: [security/adversarial-suite]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install -e '.[chat]'
      - name: Install checksum-pinned gitleaks
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      - name: Reproduce attacks and expected missing controls
        run: python security/run.py
      - name: Publish sanitized outcomes (green does not mean all attacks blocked)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('artifacts/security/results.json')
          if not path.exists():
              raise SystemExit('Evidence file missing; setup or suite failed.')
          data = json.loads(path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Adversarial outcomes\n\n')
              out.write('Known vulnerabilities and missing controls are expected failures, not security passes.\n\n')
              out.write('| ID | Result | Evidence |\n|---|---|---|\n')
              for row in data['tests']:
                  out.write(f"| {row['id']} | {row['result']} | {row['evidence']} |\n")
              out.write('\nValidated Testnet transactions: **0**.\n')
          PY
