[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w3node-team"
version = "0.3.0"
description = "Team SSH access and checksum-pinned model components"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
chat = ["mcp==1.29.0", "httpx==0.28.1"]

[project.scripts]
w3node = "w3node.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
